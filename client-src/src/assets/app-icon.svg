<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Vector redraw of the original 16x16 app.ico: blue rounded square,
       light-blue screen outline, white AirPlay triangle. Same artwork, but
       resolvable at any size — the .ico only ever contained a 16px bitmap. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B6FE8"/>
      <stop offset="1" stop-color="#0040C0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="4.0" fill="url(#bg)"/>
  <rect x="6.6" y="6.6" width="18.8" height="10.4" rx="2.4"
        fill="none" stroke="#8FB4F0" stroke-width="1.6"/>
  <path d="M16 18.6 L20.8 25.6 L11.2 25.6 Z" fill="#FFFFFF"/>
</svg>
